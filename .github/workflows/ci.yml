name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: packages/shared-types
      - run: npx tsc --noEmit
        working-directory: packages/plugin-sdk
      - run: npx tsc --noEmit
        working-directory: packages/viewer
      - run: npx tsc --noEmit
        working-directory: packages/ui

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: coverage run -m pytest tests/test_health.py tests/test_state_machine.py -v
      - run: coverage report

  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  container-build:
    name: Container Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml build

  integration-smoke:
    name: Integration Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/live > /dev/null 2>&1; then
              echo "API is live"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 3
          done
          echo "API did not start in time"
          docker compose -f infra/compose/docker-compose.yml logs api --tail=30
          exit 1
      - name: Run migrations
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T api alembic -c /app/alembic.ini upgrade head
      - name: Run smoke tests
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T api pip install pytest httpx pytest-asyncio
          docker compose -f infra/compose/docker-compose.yml exec -T api python -m pytest tests/test_integration.py tests/test_phase2_integration.py -v -x
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.yml logs --tail=80
      - name: Cleanup
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.yml down -v
