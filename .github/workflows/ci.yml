name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: packages/shared-types
      - run: npx tsc --noEmit
        working-directory: packages/plugin-sdk
      - run: npx tsc --noEmit
        working-directory: packages/viewer
      - run: npx tsc --noEmit
        working-directory: packages/ui

  plugin-contract:
    name: Plugin Contract & Nameplate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e "packages/plugin-sdk-py[dev]"
      - run: python -m pytest packages/plugin-sdk-py/tests -v
      - name: Contract CLI — fixture-echo
        run: |
          modumesh-plugin-check check plugins/fixture-echo \
            --input plugins/fixture-echo/fixtures/valid-input.json
      - name: Contract CLI — fixture-mesh
        run: |
          modumesh-plugin-check check plugins/fixture-mesh \
            --input plugins/fixture-mesh/fixtures/valid-input.json
      - name: Contract CLI — nameplate (manifest only)
        run: |
          modumesh-plugin-check check plugins/nameplate \
            --input plugins/nameplate/fixtures/valid-input.json --no-run
      - run: modumesh-plugin-check discover plugins
      - name: Nameplate geometry unit tests
        run: |
          pip install -q "cadquery>=2.4.0,<3" "trimesh>=4.0.0" "pillow>=10.0.0" "numpy>=1.26.0"
          cd plugins/nameplate && PYTHONPATH=src python -m pytest -v

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          pip install -e packages/plugin-sdk-py
          cd apps/api && pip install -e ".[dev]"
      - name: API unit tests with coverage
        working-directory: apps/api
        run: |
          coverage run -m pytest \
            tests/test_health.py \
            tests/test_state_machine.py \
            tests/test_plugins_unit.py \
            tests/test_phase6_unit.py -v
          coverage report

  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          pip install -e packages/plugin-sdk-py
          cd apps/worker && pip install -e ".[dev]"
      - run: python -m pytest -v
        working-directory: apps/worker

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install API deps + pip-audit
        run: |
          python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83.0.0' 'wheel'
          pip install -e packages/plugin-sdk-py
          cd apps/api && pip install -e ".[dev]"
          pip install --upgrade 'click>=8.3.3' pip-audit
      - run: pip-audit --skip-editable
      - name: npm audit (production, high+)
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-git

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Compose images
        run: docker compose -f infra/compose/docker-compose.yml build
      - name: Resolve API image id
        id: api_image
        run: |
          IMG=$(docker compose -f infra/compose/docker-compose.yml images -q api | head -n1)
          echo "id=$IMG" >> "$GITHUB_OUTPUT"
      - name: Trivy scan API image
        if: steps.api_image.outputs.id != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.api_image.outputs.id }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: [container-build]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health/live > /dev/null 2>&1; then
              echo "API is live"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 3
          done
          echo "API did not start in time"
          docker compose -f infra/compose/docker-compose.yml logs api --tail=40
          exit 1
      - name: Run migrations
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T api \
            alembic -c /app/alembic.ini upgrade head
      - name: Login + resync plugins
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"change_me_admin"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST http://localhost:8000/api/v1/plugins/resync \
            -H "Authorization: Bearer $TOKEN" | head -c 500
          echo
      - name: Integration smoke tests
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T api \
            pip install pytest httpx pytest-asyncio bcrypt
          docker compose -f infra/compose/docker-compose.yml exec -T api \
            python -m pytest \
              tests/test_integration.py \
              tests/test_phase2_integration.py \
              tests/test_phase3_integration.py \
              tests/test_phase5_integration.py \
              tests/test_phase6_authz.py -v -x
      - name: Verify worker security constraints
        run: |
          chmod +x scripts/verify-worker-security.sh
          ./scripts/verify-worker-security.sh
      - name: Wait for Web
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Web is live"
              exit 0
            fi
            echo "Waiting for Web... ($i)"
            sleep 3
          done
          echo "Web did not start in time"
          docker compose -f infra/compose/docker-compose.yml logs web --tail=40
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright + run e2e/a11y
        run: |
          npm ci
          cd apps/web
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://localhost:3000 \
          PLAYWRIGHT_API_URL=http://localhost:8000 \
            npx playwright test --project=chromium
      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=80
      - name: Cleanup
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  restore-test:
    name: Restore Test
    runs-on: ubuntu-latest
    needs: [container-build]
    steps:
      - uses: actions/checkout@v4
      - name: Automated restore test
        run: |
          chmod +x scripts/test-restore.sh
          ./scripts/test-restore.sh
