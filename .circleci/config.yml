# ModuMesh MakerLab — CircleCI pipeline
# Replaces GitHub Actions CI. Mirrors lint, typecheck, unit tests,
# plugin contract checks, container build, and Compose integration smoke.

version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  node22:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
  python311:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
  machine_ubuntu:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project

commands:
  checkout_repo:
    steps:
      - checkout
      - run:
          name: Show revision
          command: git rev-parse --short HEAD && git status -sb

jobs:
  lint-format:
    executor: node22
    steps:
      - checkout_repo
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Prettier check
          command: npx prettier --check .

  typecheck:
    executor: node22
    steps:
      - checkout_repo
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: TypeScript — apps/web
          command: cd apps/web && npx tsc --noEmit
      - run:
          name: TypeScript — packages/shared-types
          command: cd packages/shared-types && npx tsc --noEmit
      - run:
          name: TypeScript — packages/plugin-sdk
          command: cd packages/plugin-sdk && npx tsc --noEmit
      - run:
          name: TypeScript — packages/viewer
          command: cd packages/viewer && npx tsc --noEmit
      - run:
          name: TypeScript — packages/ui
          command: cd packages/ui && npx tsc --noEmit

  plugin-contract:
    executor: python311
    steps:
      - checkout_repo
      - run:
          name: Install plugin SDK
          command: pip install -e "packages/plugin-sdk-py[dev]"
      - run:
          name: SDK unit tests
          command: python -m pytest packages/plugin-sdk-py/tests -v
      - run:
          name: Contract CLI — fixture-echo
          command: |
            modumesh-plugin-check check plugins/fixture-echo \
              --input plugins/fixture-echo/fixtures/valid-input.json
      - run:
          name: Contract CLI — fixture-mesh
          command: |
            modumesh-plugin-check check plugins/fixture-mesh \
              --input plugins/fixture-mesh/fixtures/valid-input.json
      - run:
          name: Contract CLI — nameplate (manifest only)
          command: |
            modumesh-plugin-check check plugins/nameplate \
              --input plugins/nameplate/fixtures/valid-input.json --no-run
      - run:
          name: Discover plugins
          command: modumesh-plugin-check discover plugins
      - run:
          name: Nameplate geometry unit tests
          command: |
            pip install -q "cadquery>=2.4.0,<3" "trimesh>=4.0.0" "pillow>=10.0.0" "numpy>=1.26.0"
            cd plugins/nameplate && PYTHONPATH=src python -m pytest -v

  api-tests:
    executor: python311
    steps:
      - checkout_repo
      - run:
          name: Install API package
          command: |
            pip install -e packages/plugin-sdk-py
            cd apps/api && pip install -e ".[dev]"
      - run:
          name: API unit tests with coverage
          command: |
            cd apps/api
            coverage run -m pytest \
              tests/test_health.py \
              tests/test_state_machine.py \
              tests/test_plugins_unit.py \
              tests/test_phase6_unit.py -v
            coverage report

  worker-tests:
    executor: python311
    steps:
      - checkout_repo
      - run:
          name: Install worker package
          command: |
            pip install -e packages/plugin-sdk-py
            cd apps/worker && pip install -e ".[dev]"
      - run:
          name: Worker unit tests
          command: cd apps/worker && python -m pytest -v

  security-scan:
    executor: python311
    steps:
      - checkout_repo
      - run:
          name: Install API deps + pip-audit
          command: |
            python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83.0.0' 'wheel'
            pip install -e packages/plugin-sdk-py
            cd apps/api && pip install -e ".[dev]"
            pip install --upgrade 'click>=8.3.3' pip-audit
      - run:
          name: pip-audit API dependencies
          command: pip-audit --skip-editable
      - run:
          name: npm audit (production, high+)
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
            npm ci
            npm audit --omit=dev --audit-level=high
      - run:
          name: Secret scan (gitleaks)
          command: |
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
              | tar -xz gitleaks
            ./gitleaks detect --source . --config .gitleaks.toml --no-git

  container-build:
    executor: machine_ubuntu
    steps:
      - checkout_repo
      - run:
          name: Build Compose images
          command: docker compose -f infra/compose/docker-compose.yml build
      - run:
          name: Trivy scan API image
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin
            IMG=$(docker compose -f infra/compose/docker-compose.yml images -q api | head -n1)
            if [ -n "$IMG" ]; then
              trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMG"
            fi

  integration-smoke:
    executor: machine_ubuntu
    steps:
      - checkout_repo
      - run:
          name: Start stack
          command: |
            cp .env.example .env
            docker compose -f infra/compose/docker-compose.yml up -d --build
      - run:
          name: Wait for API
          command: |
            for i in $(seq 1 40); do
              if curl -sf http://localhost:8000/health/live > /dev/null 2>&1; then
                echo "API is live"
                exit 0
              fi
              echo "Waiting for API... ($i)"
              sleep 3
            done
            echo "API did not start in time"
            docker compose -f infra/compose/docker-compose.yml logs api --tail=40
            exit 1
      - run:
          name: Run migrations
          command: |
            docker compose -f infra/compose/docker-compose.yml exec -T api \
              alembic -c /app/alembic.ini upgrade head
      - run:
          name: Login + resync plugins
          command: |
            TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"change_me_admin"}' \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            curl -sf -X POST http://localhost:8000/api/v1/plugins/resync \
              -H "Authorization: Bearer $TOKEN" | head -c 500
            echo
      - run:
          name: Integration smoke tests
          command: |
            docker compose -f infra/compose/docker-compose.yml exec -T api \
              pip install pytest httpx pytest-asyncio bcrypt
            docker compose -f infra/compose/docker-compose.yml exec -T api \
              python -m pytest \
                tests/test_integration.py \
                tests/test_phase2_integration.py \
                tests/test_phase3_integration.py \
                tests/test_phase5_integration.py \
                tests/test_phase6_authz.py -v -x
      - run:
          name: Verify worker security constraints
          command: |
            chmod +x scripts/verify-worker-security.sh
            ./scripts/verify-worker-security.sh
      - run:
          name: Wait for Web
          command: |
            for i in $(seq 1 40); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Web is live"
                exit 0
              fi
              echo "Waiting for Web... ($i)"
              sleep 3
            done
            echo "Web did not start in time"
            docker compose -f infra/compose/docker-compose.yml logs web --tail=40
            exit 1
      - run:
          name: Install Node.js 22 for Playwright
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node -v && npm -v
      - run:
          name: Install Playwright + run Phase 4 e2e/a11y
          command: |
            npm ci
            cd apps/web
            npx playwright install --with-deps chromium
            PLAYWRIGHT_BASE_URL=http://localhost:3000 \
            PLAYWRIGHT_API_URL=http://localhost:8000 \
              npx playwright test --project=chromium
      - run:
          name: Show logs on failure
          when: on_fail
          command: docker compose -f infra/compose/docker-compose.yml logs --tail=80
      - run:
          name: Cleanup
          when: always
          command: docker compose -f infra/compose/docker-compose.yml down -v

  restore-test:
    executor: machine_ubuntu
    steps:
      - checkout_repo
      - run:
          name: Automated restore test
          command: |
            chmod +x scripts/test-restore.sh
            ./scripts/test-restore.sh

workflows:
  ci:
    jobs:
      - lint-format
      - typecheck
      - plugin-contract
      - api-tests
      - worker-tests
      - security-scan
      - container-build
      - integration-smoke:
          requires:
            - container-build
      - restore-test:
          requires:
            - container-build
