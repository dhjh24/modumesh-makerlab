[project]
name = "modumesh-nameplate-plugin"
version = "1.0.0"
description = "Reference CadQuery nameplate plugin for ModuMesh MakerLab"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4.0,<3",
    "trimesh>=4.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
