# Gitleaks configuration for ModuMesh MakerLab secret scanning.
title = "ModuMesh MakerLab"

[extend]
useDefault = true

[allowlist]
description = "Dev placeholders, local secrets file, and fixtures"
paths = [
  '''\.env$''',
  '''\.env\.example$''',
  '''\.env\..*$''',
  '''backups/''',
  '''node_modules/''',
  '''\.venv/''',
  '''\.next/''',
  '''docs/''',
  '''plugins/.*/fixtures/''',
  '''apps/.*/tests/''',
  '''apps/web/(test-results|playwright-report)/''',
]
regexes = [
  '''change_me''',
  '''modumesh_dev''',
]
