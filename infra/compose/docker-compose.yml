services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modumesh']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_in_production}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_in_production}
      MINIO_BUCKET: ${MINIO_BUCKET:-modumesh-models}
      API_CORS_ORIGINS: http://localhost:3000
      API_PLUGIN_DIR: /plugins
    # Plugin source is baked read-only into the image. Optional bind mount for
    # local plugin development (still mounted read-only; no docker.sock).
    volumes:
      - ../../plugins:/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_in_production}
      WORKER_PLUGIN_TIMEOUT_SECONDS: 300
      WORKER_MAX_MEMORY_MB: 512
      WORKER_LEASE_SECONDS: 30
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 10
      WORKER_REAPER_INTERVAL_SECONDS: 15
      WORKER_SAMPLE_STEP_DELAY_MS: 200
      WORKER_POLL_INTERVAL_SECONDS: 2
      WORKER_PLUGIN_DIR: /plugins
      MODUMESH_DENY_DOCKER_SOCK: '1'
      MINIO_BUCKET: ${MINIO_BUCKET:-modumesh-models}
    volumes:
      - ../../plugins:/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Browser talks to host-mapped API; CORS allows localhost:3000.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
