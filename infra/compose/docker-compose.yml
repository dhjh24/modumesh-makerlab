services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    # No host port published: reachable only on the internal compose network
    # by service name (api/worker). To debug from the host, uncomment:
    # ports: ['5434:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modumesh']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # GM-12 D1.1: requirepass. The password comes from the compose env
    # (${REDIS_PASSWORD:-}); the empty default keeps local dev stacks
    # password-free, while the API's fail-closed boot validation
    # (validate_boot_secrets) refuses non-development environments with an
    # empty/default REDIS_PASSWORD. No host port (internal network only).
    # NOTE: the password is interpolated into the healthcheck shell string,
    # so use shell-safe values (e.g. `openssl rand -hex 32`).
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-}']
    healthcheck:
      # redis-cli needs AUTH when requirepass is set — plain `ping` would
      # fail. --no-auth-warning silences redis-cli's auth warning on stderr
      # (supported by redis:7-alpine).
      test:
        [
          'CMD-SHELL',
          'if [ -n "${REDIS_PASSWORD:-}" ]; then redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # Pinned release tag (audit M18); digest pinning tracked via
    # renovate.json (base-image group).
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_in_production}
    # No host ports published: api/worker reach it as minio:9000 on the
    # internal network. Caddy does NOT proxy the MinIO console, so nothing
    # needs these ports. For local debugging, uncomment:
    # ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: modumesh-api:${MAKERLAB_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - '${MAKERLAB_API_HOST_PORT:-8002}:8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_in_production}
      MINIO_BUCKET: ${MINIO_BUCKET:-modumesh-models}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://makerlab.example.com}
      # Override for LAN dev access, e.g.:
      #   API_CORS_ORIGINS=http://SERVER_LAN_IP:3002
      API_PLUGIN_DIR: /plugins
      # Deployment environment — non-"development" enables fail-closed
      # datastore-secret validation (GM-12 D1.2) and disables /docs +
      # /openapi.json (GM-12 D1.4).
      API_ENV: ${API_ENV:-development}
      # Alembic runs as an explicit deploy step; opt into in-app migration
      # with API_RUN_MIGRATIONS=1 (GM-12 D1.6).
      API_RUN_MIGRATIONS: ${API_RUN_MIGRATIONS:-0}
      # Optional bearer token for GET /api/v1/metrics (empty = no auth).
      API_METRICS_TOKEN: ${API_METRICS_TOKEN:-}
      # Disable in CI/local smoke stacks; keep enabled for production.
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_RPM: ${API_RATE_LIMIT_RPM:-60}
      API_JOB_RATE_LIMIT_RPM: ${API_JOB_RATE_LIMIT_RPM:-10}
      # Admin auth — fail-closed. The API refuses to boot when ADMIN_API_KEY
      # is empty or ADMIN_PLUGIN_SIGNING_SECRET is the default "dev-secret".
      # Compose defaults to empty so `docker compose config` stays valid; the
      # container itself fails fast at startup if they are unset.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_PLUGIN_SIGNING_SECRET: ${ADMIN_PLUGIN_SIGNING_SECRET:-}
      # Comma-separated CIDRs of reverse proxies trusted to supply
      # X-Forwarded-For. Empty (default) = never trust the header.
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      # Shared dir where api + worker write per-process Prometheus metrics;
      # the API's /api/v1/metrics aggregates both (GM-12 D4.1).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-metrics
    # Plugin source is baked read-only into the image. Optional bind mount for
    # local plugin development (still mounted read-only; no docker.sock).
    volumes:
      - ../../plugins:/plugins:ro
      - metricsdata:/tmp/prometheus-metrics
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).getcode() == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: modumesh-worker:${MAKERLAB_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-modumesh}
      POSTGRES_USER: ${POSTGRES_USER:-modumesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_in_production}
      WORKER_PLUGIN_TIMEOUT_SECONDS: 300
      WORKER_MAX_MEMORY_MB: 512
      WORKER_LEASE_SECONDS: 30
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 10
      WORKER_REAPER_INTERVAL_SECONDS: 15
      WORKER_SAMPLE_STEP_DELAY_MS: 200
      WORKER_POLL_INTERVAL_SECONDS: 2
      WORKER_PLUGIN_DIR: /plugins
      MODUMESH_DENY_DOCKER_SOCK: '1'
      MINIO_BUCKET: ${MINIO_BUCKET:-modumesh-models}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-metrics
    volumes:
      - ../../plugins:/plugins:ro
      - metricsdata:/tmp/prometheus-metrics
    # Worker liveness = Redis reachable (job queue is its lifeline).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import os, redis; redis.Redis(host='redis', port=6379, db=0, password=os.environ.get('REDIS_PASSWORD') or None, socket_connect_timeout=3).ping()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Production: empty = same-origin /api/v1/… via Next.js rewrites
        - NEXT_PUBLIC_API_URL=
        # Server-side rewrite target (Docker internal DNS)
        - API_INTERNAL_URL=http://api:8000
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      # Production: browser uses same-origin /api/v1/… rewrites (no CORS needed)
      NEXT_PUBLIC_API_URL: ''
      # Server-side: Next.js rewrites /api/v1/* → api:8000
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - api

  # ── One-shot backup runner (GM-12 D2.2) ───────────────────────────────
  # Same image as api; runs scripts/backup.sh (mounted read-only) once per
  # `docker compose up`/`run backup`. NOTE: the stock api image has neither
  # pg_dump nor the MinIO client (mc) — running this service against it fails
  # loudly with an actionable message. Either run scripts/backup.sh from the
  # host cron with host tools (recommended — see docs/runbook.md) or extend
  # the image with postgresql-client + mc. No host ports.
  backup:
    image: modumesh-api:${MAKERLAB_IMAGE_TAG:-local}
    entrypoint: ['/scripts/backup.sh']
    user: root
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-modumesh}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      PGDATABASE: ${POSTGRES_DB:-modumesh}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-modumesh}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_in_production}
      MINIO_BUCKET: ${MINIO_BUCKET:-modumesh-models}
      BACKUP_TARGET: modumesh
      BACKUP_DIR: /var/backups/modumesh
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../../scripts:/scripts:ro
      - backupdata:/var/backups/modumesh
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    restart: 'no'

  # ── Optional Caddy reverse proxy (production HTTPS) ─────────────────
  # Uncomment and configure for TLS termination + same-origin API proxy.
  # Set your domain in infra/caddy/Caddyfile before enabling.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddydata:/data
  #   depends_on:
  #     - web
  #     - api

volumes:
  pgdata:
  miniodata:
  metricsdata:
  backupdata:
  caddydata:
